<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />

  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider checkout">
    <section class="products">
      <h2>Review & Place your Order</h2>
      <section class="checkout-form">
        <form name="checkout">
          <input type="hidden" name="orderDate" id="orderDate" />

          <fieldset>
            <legend>Shipping</legend>
            <div class="checkout__name">
              <label for="fname">First Name</label>
              <input type="text" name="fname" id="fname" autocomplete="given-name" required />
              <label for="lname">Last Name</label>
              <input type="text" name="lname" id="lname" autocomplete="family-name" required />
            </div>
            <div class="checkout__address">
              <label for="street">Street Address</label>
              <input type="text" name="street" id="street" autocomplete="street-address" required />
              <label for="city">City</label>
              <input type="text" name="city" id="city" autocomplete="address-level2" required />
              <label for="state">State</label>
              <input type="text" name="state" id="state" autocomplete="address-level1" required />
              <label for="zip">Zip</label>
              <input type="text" name="zip" id="zip" autocomplete="postal-code" required />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="checkout__payment">
              <label for="cardNumber">Card Number</label>
              <input type="text" name="cardNumber" id="cardNumber" autocomplete="cc-number"
                placeholder="1234123412341234" required />
              <label for="expiration">Expiration</label>
              <input type="text" name="expiration" id="expiration" autocomplete="cc-exp" placeholder="MM/YY" required />
              <label for="code">CVV</label>
              <input type="text" name="code" id="code" autocomplete="cc-csc" placeholder="123" required />
            </div>
          </fieldset>

          <fieldset class="checkout-summary">
            <legend>Order Summary</legend>

            <div class="order__summary">
              <div>Items</div>
              <div id="num-items"></div>
              <div>Subtotal</div>
              <div id="cartTotal"></div>
              <div>Tax</div>
              <div id="tax"></div>
              <div>Shipping</div>
              <div id="shipping"></div>
              <div>Total</div>
              <div id="orderTotal"></div>
            </div>
          </fieldset>
          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </section>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
